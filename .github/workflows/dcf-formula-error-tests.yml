name: DCF formula error regression tests

on:
  pull_request:
    paths:
      - 'plugins/**/dcf-model/scripts/validate_dcf.py'
      - 'scripts/tests/test_dcf_formula_errors.py'
      - '.github/workflows/dcf-formula-error-tests.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/**/dcf-model/scripts/validate_dcf.py'
      - 'scripts/tests/test_dcf_formula_errors.py'
      - '.github/workflows/dcf-formula-error-tests.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'openpyxl>=3.0.0'
      - run: python -m unittest discover -s scripts/tests -p test_dcf_formula_errors.py -v
